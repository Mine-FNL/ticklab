name: E2E (Playwright)

# Runs Playwright E2E suite on push to master and PRs. Separate from
# the main CI workflow because:
#  1. E2E needs `npx playwright install chromium` which is ~150MB and
#     adds setup cost to every CI run.
#  2. E2E takes 30-60s even for the happy-path specs.
#  3. E2E is more flaky (depends on dev server + browser); failure
#     isolation is more useful than running it on every push.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Build first so the dev server (npm run dev) starts cleanly.
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx --no-install next build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID || 'ci-placeholder' }}

      # Then the E2E package.
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 7
